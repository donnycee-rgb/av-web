<!doctype html><html><head><meta charset="utf-8"><title>logo check</title>
<style>body{margin:0;font:12px sans-serif;background:#888}table{border-collapse:collapse}td{padding:8px;border:1px solid #555;vertical-align:middle}
.w{background:#fff}.d{background:#0b1220}img{height:70px;width:auto;max-width:260px;display:block}.mono{filter:brightness(0) invert(1);opacity:.85}</style></head><body><table>
<tr><td>file</td><td>original</td><td>cleaned on white</td><td>cleaned in strip</td></tr>
<script>
const rows=[['davic logo.svg','davic.svg'],['LE logo.svg','le.svg'],['NICAKAI LOGO.svg','nicakai.svg'],['UTQ PNG LOGO.svg','utq.svg'],['png utq onehope logo.svg','utq-onehope.svg'],['grapa media.svg','grapa-media.svg']];
for(const [o,c] of rows) document.write(`<tr><td>${c}</td><td class=w><img src="/src/assets/logos/${encodeURIComponent(o)}"></td><td class=w><img src="/logos/${c}"></td><td class=d><img class=mono src="/logos/${c}"></td></tr>`);
</script></table></body></html>
